name = "git-learning-lab-api"
main = "src/index.js"
compatibility_date = "2026-09-06"

# D1 binding — real database, created via `wrangler d1 create` during the P1
# completion pass (region: APAC). database_id is a resource identifier, not a
# secret — safe to commit (same as Cloudflare's own `wrangler d1 create`
# output convention).
[[d1_databases]]
binding = "DB"
database_name = "git-learning-lab-db"
database_id = "6df6c304-173a-46fc-b576-205e944341da"
migrations_dir = "../migrations"

# No [vars] secrets belong in this file. Real secrets are set via
# `wrangler secret put <NAME>` or the Cloudflare dashboard, never committed.
